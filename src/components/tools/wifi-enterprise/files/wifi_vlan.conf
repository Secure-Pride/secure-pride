# /etc/freeradius/3.0/policy.d/wifi_vlan
# Put each device on a network segment based on its certificate name.
# Names start with a role: staff-, volunteer-, or iot-.
wifi_vlan {
	if (&TLS-Client-Cert-Common-Name =~ /^staff-/) {
		update reply {
			&Tunnel-Type := VLAN
			&Tunnel-Medium-Type := IEEE-802
			&Tunnel-Private-Group-Id := "10"
		}
	}
	elsif (&TLS-Client-Cert-Common-Name =~ /^volunteer-/) {
		update reply {
			&Tunnel-Type := VLAN
			&Tunnel-Medium-Type := IEEE-802
			&Tunnel-Private-Group-Id := "20"
		}
	}
	elsif (&TLS-Client-Cert-Common-Name =~ /^iot-/) {
		update reply {
			&Tunnel-Type := VLAN
			&Tunnel-Medium-Type := IEEE-802
			&Tunnel-Private-Group-Id := "30"
		}
	}
	else {
		reject
	}
}
