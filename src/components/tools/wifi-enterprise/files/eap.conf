# /etc/freeradius/3.0/mods-available/eap
# EAP-TLS only. Every device proves itself with its own certificate.
eap {
	default_eap_type = tls
	timer_expire = 60
	ignore_unknown_eap_types = no
	max_sessions = ${max_requests}

	tls-config tls-common {
		private_key_file = ${certdir}/wifi/server.key
		certificate_file = ${certdir}/wifi/server.crt

		# Trust ONLY your own Wi-Fi CA. Never the system bundle.
		ca_file = ${certdir}/wifi/ca.pem
		ca_path = ${certdir}/wifi/ca.d

		# Reject revoked devices, and re-read the CRL every hour so it
		# never expires in memory (an expired CRL blocks every login).
		check_crl = yes
		ca_path_reload_interval = 3600

		# The identity a device sends must match its certificate name.
		check_cert_cn = %{User-Name}

		tls_min_version = "1.2"
		tls_max_version = "1.2"
		cipher_list = "DEFAULT"
		ecdh_curve = ""

		cache {
			enable = no
		}
	}

	tls {
		tls = tls-common
	}
}
