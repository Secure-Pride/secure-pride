# /etc/freeradius/3.0/clients.conf  (replaces the whole file)
# Each access point, or the controller that relays for them, gets its
# own block and its own long random secret from your password manager.

client office-ap-1 {
	ipaddr = 192.168.1.20
	secret = REPLACE_WITH_SECRET_1
	require_message_authenticator = yes
}

# Lets you test from the RADIUS host itself. Uses a different secret.
client localhost {
	ipaddr = 127.0.0.1
	secret = REPLACE_WITH_SECRET_2
	require_message_authenticator = yes
}
